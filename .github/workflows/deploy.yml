name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Create docs directory if it doesn't exist
        run: mkdir -p docs

      - name: Copy static files
        run: |
          mkdir -p docs/assets
          cp demo.jpg docs/assets/ || true

      - name: Set up environment variables
        run: |
          echo "WEBHOOK_URL=${{ github.repository_owner }}.github.io/${{ github.repository_name }}" >> $GITHUB_ENV

      - name: Build
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: docs
          clean: true